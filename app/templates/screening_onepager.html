{% extends "base.html" %}
{% block title %}One-pager {{ enterprise_number }} — NBB M&A Screening{% endblock %}
{% block content %}
<h1>One-pager — {{ enterprise_number }}</h1>
<p><a href="/screening/longlist">&larr; terug naar de longlist</a></p>
{% if error %}
<div class="card"><p class="error">{{ error }}</p></div>
{% else %}
<div class="card">
  <pre class="report">{{ report }}</pre>
</div>
{% endif %}
{% endblock %}
