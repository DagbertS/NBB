[project]
name = "screen"
version = "0.1.0"
description = "Reproduceerbare screening-pipeline voor Belgische overnamedoelwitten (KBO, NBB, Statbel, Staatsblad)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "polars>=1.0",
    "duckdb>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastexcel>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "xlsxwriter>=3.0"]

[project.scripts]
screen = "screen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
